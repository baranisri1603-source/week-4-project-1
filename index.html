<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem auto;
      max-width: 24rem;
      padding: 0 1rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
    }

    input {
      box-sizing: border-box;
      padding: 0.5rem;
      width: 100%;
    }

    .error {
      color: #b00020;
      display: block;
      margin-top: 0.25rem;
      min-height: 1em;
    }

    button {
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <form id="registration-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error">
        <span class="error" id="name-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
        <span class="error" id="email-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error">
        <span class="error" id="password-error" aria-live="polite"></span>
      </div>

      <button id="submit-button" type="submit" disabled>Register</button>
      <p id="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("registration-form");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submit-button");
    const formMessage = document.getElementById("form-message");

    const fields = [
      {
        input: nameInput,
        error: document.getElementById("name-error"),
        validate: () => nameInput.value.trim() ? "" : "Name is required."
      },
      {
        input: emailInput,
        error: document.getElementById("email-error"),
        validate: () => emailInput.validity.valid && emailInput.value.trim()
          ? ""
          : "Enter a valid email address."
      },
      {
        input: passwordInput,
        error: document.getElementById("password-error"),
        validate: () => passwordInput.value.length >= 6
          ? ""
          : "Password must be at least 6 characters."
      }
    ];

    function validateField(field, showError) {
      const message = field.validate();
      field.input.setAttribute("aria-invalid", message ? "true" : "false");
      field.error.textContent = showError ? message : "";
      return !message;
    }

    function validateForm() {
      let isValid = true;
      for (const field of fields) {
        if (!validateField(field, true)) {
          isValid = false;
        }
      }
      submitButton.disabled = !isValid;
      return isValid;
    }

    for (const field of fields) {
      field.input.addEventListener("input", () => {
        formMessage.textContent = "";
        validateForm();
      });
      field.input.addEventListener("blur", () => validateField(field, true));
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!validateForm()) {
        return;
      }
      formMessage.textContent = "Registration details are valid.";
    });
  </script>
</body>
</html>
